name: CI

# Runs once GitHub ships the macos-27 image; until then the gate is
# Scripts/release.sh on the maintainer's macOS 27 Mac.
on: workflow_dispatch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the API check
      - name: Toolchain
        run: swift --version
      - name: Build (warnings are errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Test
        # Golden images are recorded on the maintainer's macOS and fonts; another OS renders text
        # differently, so CI runs every test but those.
        env:
          LUMEN_SKIP_GOLDENS: "1"
          # Hosted runners are slower, shared VMs; widen every performance budget equally.
          LUMEN_PERF_BUDGET_SCALE: "2"
        run: swift test --skip-build
      - name: API check against the last release
        run: Scripts/api-check.sh
